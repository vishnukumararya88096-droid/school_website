<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance - Vidya Vihar Public School</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; }
        
        header { 
            background: linear-gradient(135deg, #1e3c72, #2a5298); 
            color: white; 
            padding: 22px 35px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
        
        .back-btn { 
            background-color: #ffffff; 
            color: #1e3c72; 
            padding: 8px 18px; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 14px; 
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .back-btn:hover { background-color: #e3f2fd; transform: translateY(-1px); }
        
        .container { 
            max-width: 800px; 
            margin: 35px auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.06); 
            border-top: 6px solid;
            border-image: linear-gradient(135deg, #2193b0, #6dd5ed) 1;
        }
        
        h2 { 
            color: #1e3c72; 
            border-bottom: 2px solid #edf2f7; 
            padding-bottom: 12px; 
            font-size: 20px; 
            margin-top: 0; 
        }
        
        .inline-selector { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .inline-selector label { font-weight: 600; color: #4a5568; font-size: 14px; }
        .inline-selector select { padding: 8px 12px; font-size: 15px; border-radius: 6px; border: 1px solid #cbd5e0; font-weight: bold; color: #1e3c72; background: white; outline: none; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { padding: 12px; text-align: center; border: 1px solid #e2e8f0; font-size: 14px; }
        th { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; }
        
        .scrollable-table { max-height: 450px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; }

        @media screen and (max-width: 600px) {
            header { padding: 15px; flex-direction: column; align-items: flex-start; }
            header h1 { font-size: 18px; }
            .container { margin: 15px; padding: 20px; width: auto; }
            .inline-selector { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>

    <header>
        <h1>📅 Attendance Record</h1>
        <a href="#" id="backDashboard" class="back-btn">← Back to Dashboard</a>
    </header>

    <div class="container">
        <h2 id="studentTitle">Loading Student...</h2>
        
        <div class="inline-selector">
            <label>Month & Year:</label>
            <select id="viewMonth" onchange="loadAttendanceTable()">
                <option value="0" selected>January</option>
                <option value="1">February</option>
                <option value="2">March</option>
                <option value="3">April</option>
                <option value="4">May</option>
                <option value="5">June</option>
                <option value="6">July</option>
                <option value="7">August</option>
                <option value="8">September</option>
                <option value="9">October</option>
                <option value="10">November</option>
                <option value="11">December</option>
            </select>

            <select id="viewYear" onchange="loadAttendanceTable()">
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
                <option value="2027">2027</option>
            </select>
        </div>

        <div class="scrollable-table">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Attendance Status</th>
                    </tr>
                </thead>
                <tbody id="attendanceTableBody">
                    <tr><td colspan="2">Loading attendance records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3XBCZ2ZTwfqT2y3EXrkW0LPEz4fj9tBc",
            authDomain: "vidya-vihar-public-schoo-f3b61.firebaseapp.com",
            projectId: "vidya-vihar-public-schoo-f3b61",
            storageBucket: "vidya-vihar-public-schoo-f3b61.firebasestorage.app",
            messagingSenderId: "872134534556",
            appId: "1:872134534556:web:7fb8ea167c2947b5c05459"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        let studentId = urlParams.get('id');

        // Set back button link with ID
        if (studentId) {
            document.getElementById("backDashboard").href = `student-dashboard.html?id=${studentId}`;
        }

        let attendanceData = {};
        const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

        function getDaysInMonth(month, year) {
            return new Date(year, month + 1, 0).getDate();
        }

        async function fetchAttendanceData() {
            if (!studentId) {
                document.getElementById("studentTitle").innerText = "No student session found.";
                return;
            }

            try {
                const docRef = doc(db, "students", studentId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    let data = docSnap.data();
                    document.getElementById("studentTitle").innerText = `Attendance for: ${data.studentName || 'Student'} (${data.admissionNo || ''})`;
                    attendanceData = data.attendance || {};
                    loadAttendanceTable();
                } else {
                    document.getElementById("studentTitle").innerText = "Student record not found.";
                }
            } catch (error) {
                console.error("Error fetching attendance: ", error);
                document.getElementById("studentTitle").innerText = "Failed to load attendance.";
            }
        }

        window.loadAttendanceTable = function() {
            let month = parseInt(document.getElementById("viewMonth").value);
            let year = parseInt(document.getElementById("viewYear").value);
            let totalDays = getDaysInMonth(month, year);
            let tbody = document.getElementById("attendanceTableBody");
            tbody.innerHTML = "";

            for (let i = 1; i <= totalDays; i++) {
                let dayStr = i < 10 ? "0" + i : "" + i;
                let monthStr = (month + 1) < 10 ? "0" + (month + 1) : "" + (month + 1);
                let dateKey = `${year}-${monthStr}-${dayStr}`;
                let formattedDate = `${dayStr} ${monthNames[month].substring(0,3)} ${year}`;

                let currentVal = attendanceData[dateKey] || "Not Marked";

                let colorStyle = "color: #718096;";
                if (currentVal.includes("Present")) colorStyle = "color: #2e7d32; font-weight: bold;";
                else if (currentVal.includes("Absent")) colorStyle = "color: #c62828; font-weight: bold;";

                let tr = document.createElement("tr");
                tr.innerHTML = `
                    <td>${formattedDate}</td>
                    <td style="${colorStyle}">${currentVal}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        window.addEventListener('DOMContentLoaded', fetchAttendanceData);
    </script>

</body>
</html>
