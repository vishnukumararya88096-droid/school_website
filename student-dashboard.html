<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Vidya Vihar Public School</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; }
        
        header { 
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            color: white; 
            padding: 22px 35px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
        
        .logout-btn { 
            background-color: #e53935; 
            color: white; 
            padding: 8px 18px; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 14px; 
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(229,57,53,0.3);
        }
        .logout-btn:hover { background-color: #c62828; transform: translateY(-1px); }
        
        .container { 
            max-width: 900px; 
            margin: 35px auto; 
            background: white; 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.06); 
            border-top: 6px solid;
            border-image: linear-gradient(135deg, #11998e, #38ef7d) 1;
        }
        
        h2, h3 { 
            color: #0f2027; 
            border-bottom: 2px solid #edf2f7; 
            padding-bottom: 12px; 
            font-size: 20px; 
            margin-top: 0;
        }
        
        .profile-row { 
            display: flex; 
            flex-wrap: wrap; 
            margin-bottom: 16px; 
            border-bottom: 1px solid #f8f9fa; 
            padding-bottom: 12px; 
            align-items: center;
        }
        .profile-label { flex: 1; min-width: 140px; font-weight: 600; color: #4a5568; font-size: 15px; }
        .profile-value { flex: 2; min-width: 160px; color: #2d3748; font-size: 15px; font-weight: 500; word-break: break-word; }
        
        /* Aesthetic & Colorful Portal Navigation Grid */
        .portal-nav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 25px;
        }
        
        .portal-card {
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .portal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 22px rgba(0,0,0,0.15);
            filter: brightness(1.05);
        }
        
        .portal-card span {
            display: block;
            font-size: 30px;
            margin-bottom: 8px;
        }

        /* Unique Vibrant Gradients for Each Card */
        .card-attendance { background: linear-gradient(135deg, #00b09b, #96c93d); }
        .card-fees { background: linear-gradient(135deg, #2193b0, #6dd5ed); }
        .card-marksheet { background: linear-gradient(135deg, #f7971e, #ffd200); color: #fff; }
        .card-admit { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }

        /* Mobile Responsive Adjustments */
        @media screen and (max-width: 600px) {
            header {
                padding: 15px;
                flex-direction: column;
                align-items: flex-start;
            }
            header h1 { font-size: 18px; }
            .container {
                margin: 15px;
                padding: 20px;
            }
            .profile-row {
                flex-direction: column;
                gap: 4px;
            }
            .portal-nav-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎓 Student Portal - Vidya Vihar Public School</h1>
        <a href="login.html" class="logout-btn">Logout</a>
    </header>

    <div class="container">
        <h2>👤 My Personal Details</h2>
        
        <div class="profile-row"><div class="profile-label">Student Name:</div><div class="profile-value" id="display-studentName">Loading...</div></div>
        <div class="profile-row"><div class="profile-label">Admission No. / ID:</div><div class="profile-value" id="display-admissionNo">Loading...</div></div>
        <div class="profile-row"><div class="profile-label">Class:</div><div class="profile-value" id="display-className">Loading...</div></div>
        <div class="profile-row"><div class="profile-label">Father's Name:</div><div class="profile-value" id="display-fatherName">Loading...</div></div>
        <div class="profile-row"><div class="profile-label">Mother's Name:</div><div class="profile-value" id="display-motherName">Loading...</div></div>
        <div class="profile-row"><div class="profile-label">Contact Number:</div><div class="profile-value" id="display-contactNo">Loading...</div></div>

        <!-- Student Portal Options / Navigation Grid -->
        <div style="margin-top: 35px;">
            <h3>📌 Quick Portal Menu</h3>
            <div class="portal-nav-grid" id="portalMenuGrid">
                <!-- Dynamic Links will be injected here -->
            </div>
        </div>

    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3XBCZ2ZTwfqT2y3EXrkW0LPEz4fj9tBc",
            authDomain: "vidya-vihar-public-schoo-f3b61.firebaseapp.com",
            projectId: "vidya-vihar-public-schoo-f3b61",
            storageBucket: "vidya-vihar-public-schoo-f3b61.firebasestorage.app",
            messagingSenderId: "872134534556",
            appId: "1:872134534556:web:7fb8ea167c2947b5c05459"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        let studentId = urlParams.get('id');

        let studentDataGlobal = {};
        const fields = ['studentName', 'admissionNo', 'className', 'fatherName', 'motherName', 'contactNo'];

        async function fetchStudentProfile() {
            if (!studentId) {
                document.getElementById("display-studentName").innerText = "No student session found.";
                return;
            }

            const menuGrid = document.getElementById("portalMenuGrid");
            menuGrid.innerHTML = `
                <a href="attendance.html?id=${studentId}" class="portal-card card-attendance"><span>📅</span>Attendance</a>
                <a href="fees.html?id=${studentId}" class="portal-card card-fees"><span>💰</span>Fee Status</a>
                <a href="marksheet.html?id=${studentId}" class="portal-card card-marksheet"><span>📊</span>Marksheet</a>
                <a href="admit-card.html?id=${studentId}" class="portal-card card-admit"><span>🪪</span>Admit Card</a>
            `;

            try {
                const docRef = doc(db, "students", studentId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    studentDataGlobal = docSnap.data();
                    fields.forEach(field => {
                        const container = document.getElementById(`display-${field}`);
                        container.innerText = studentDataGlobal[field] || 'N/A';
                    });
                } else {
                    document.getElementById("display-studentName").innerText = "Student record not found.";
                }
            } catch (error) {
                console.error("Error fetching profile: ", error);
            }
        }

        window.addEventListener('DOMContentLoaded', fetchStudentProfile);
    </script>

</body>
</html>
