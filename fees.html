<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Status - Vidya Vihar Public School</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; }
        
        header { 
            background: linear-gradient(135deg, #1e3c72, #2a5298); 
            color: white; 
            padding: 15px 25px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: 0.5px; }
        
        .back-btn { 
            background-color: #ffffff; 
            color: #1e3c72; 
            padding: 6px 14px; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 13px; 
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .back-btn:hover { background-color: #e3f2fd; transform: translateY(-1px); }
        
        .container { 
            max-width: 850px; 
            margin: 25px auto; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.06); 
            border-top: 6px solid;
            border-image: linear-gradient(135deg, #2193b0, #6dd5ed) 1;
        }
        
        .top-flex { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; border-bottom: 2px solid #edf2f7; padding-bottom: 12px; margin-bottom: 20px; }
        h2 { color: #1e3c72; margin: 0; font-size: 18px; }
        
        .year-selector { display: flex; align-items: center; gap: 8px; }
        .year-selector label { font-weight: 600; color: #4a5568; font-size: 13px; }
        .year-selector select { padding: 5px 10px; font-size: 13px; border-radius: 6px; border: 1px solid #cbd5e0; font-weight: bold; color: #1e3c72; background: white; }

        .student-info { background: #e3f2fd; padding: 10px 15px; border-radius: 8px; margin-bottom: 20px; font-weight: 600; color: #1e3c72; font-size: 13px; }

        /* Fee Summary Cards Grid */
        .fee-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        .summary-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .summary-card h4 {
            margin: 0 0 8px 0;
            color: #4a5568;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .summary-card .amount {
            margin: 0;
            font-size: 20px;
            font-weight: bold;
            color: #1e3c72;
        }

        /* Month-wise Accordion List */
        .month-item { border: 1px solid #e2e8f0; border-radius: 8px; margin-bottom: 10px; overflow: hidden; background: #fafafa; }
        .month-header { padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 600; color: #2d3748; background: #fff; font-size: 14px; transition: background 0.2s; }
        .month-header:hover { background: #f1f5f9; }
        
        .status-badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .status-paid { background: #c8e6c9; color: #2e7d32; }
        .status-due { background: #ffcdd2; color: #c62828; }
        .status-pending { background: #ffe0b2; color: #ef6c00; }
        
        .month-body { padding: 15px 18px; background: #fafafa; border-top: 1px solid #e2e8f0; display: none; }
        .month-body.active { display: block; }

        .fee-detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed #edf2f7; font-size: 13px; color: #4a5568; }
        .fee-detail-row:last-child { border-bottom: none; }
        .fee-detail-row span:last-child { font-weight: 600; color: #2d3748; }

        @media screen and (max-width: 600px) {
            header { padding: 12px 15px; flex-direction: column; align-items: flex-start; }
            header h1 { font-size: 16px; }
            .container { margin: 10px; padding: 15px; width: auto; }
            .top-flex { flex-direction: column; align-items: flex-start; gap: 8px; }
            .fee-summary-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>💰 Fee Status Portal</h1>
        <a href="#" id="backDashboard" class="back-btn">← Back to Dashboard</a>
    </header>

    <div class="container">
        <div class="top-flex">
            <h2>Month-wise Fee Record</h2>
            <div class="year-selector">
                <label>Year:</label>
                <select id="viewYear" onchange="renderFeePortal()">
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>
        </div>

        <div class="student-info" id="studentDetailsBox">Loading student info...</div>

        <!-- Fee Summary Cards -->
        <div class="fee-summary-grid">
            <div class="summary-card">
                <h4>Total Fee</h4>
                <p class="amount" id="totalFee">₹0</p>
            </div>
            <div class="summary-card">
                <h4>Paid Amount</h4>
                <p class="amount" style="color: #2e7d32;" id="paidFee">₹0</p>
            </div>
            <div class="summary-card">
                <h4>Pending Due</h4>
                <p class="amount" style="color: #c62828;" id="pendingFee">₹0</p>
            </div>
        </div>

        <h3 style="color: #1e3c72; font-size: 16px; margin-bottom: 12px;">📅 Monthly Breakdown</h3>

        <!-- Months Container -->
        <div id="monthsContainer">
            <!-- Populated via JS -->
        </div>
    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3XBCZ2ZTwfqT2y3EXrkW0LPEz4fj9tBc",
            authDomain: "vidya-vihar-public-schoo-f3b61.firebaseapp.com",
            projectId: "vidya-vihar-public-schoo-f3b61",
            storageBucket: "vidya-vihar-public-schoo-f3b61.firebasestorage.app",
            messagingSenderId: "872134534556",
            appId: "1:872134534556:web:7fb8ea167c2947b5c05459"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        let studentId = urlParams.get('id');

        if (studentId) {
            document.getElementById("backDashboard").href = `student-dashboard.html?id=${studentId}`;
        }

        const months = [
            "January", "February", "March", "April", "May", "June", 
            "July", "August", "September", "October", "November", "December"
        ];

        let studentDataGlobal = {};
        let monthlyFeesGlobal = {};

        async function fetchFeeData() {
            if (!studentId) {
                document.getElementById("studentDetailsBox").innerText = "No student session found.";
                return;
            }

            try {
                const docRef = doc(db, "students", studentId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    studentDataGlobal = docSnap.data();
                    monthlyFeesGlobal = studentDataGlobal.monthlyFees || {};
                    
                    document.getElementById("studentDetailsBox").innerText = `Student: ${studentDataGlobal.studentName || 'N/A'} | Admission No: ${studentDataGlobal.admissionNo || 'N/A'} | Class: ${studentDataGlobal.className || 'N/A'}`;
                    
                    renderFeePortal();
                } else {
                    document.getElementById("studentDetailsBox").innerText = "Student record not found.";
                }
            } catch (error) {
                console.error("Error fetching fee details: ", error);
                document.getElementById("studentDetailsBox").innerText = "Failed to load fee details.";
            }
        }

        window.renderFeePortal = function() {
            const container = document.getElementById("monthsContainer");
            container.innerHTML = "";
            const selectedYear = document.getElementById("viewYear").value;

            const yearData = monthlyFeesGlobal[selectedYear] || {};

            let totalSum = 0;
            let paidSum = 0;
            let dueSum = 0;

            months.forEach((month, index) => {
                const mData = yearData[month] || { total: 0, paid: 0, due: 0, status: "Due" };
                
                let tVal = parseFloat(mData.total) || 0;
                let pVal = parseFloat(mData.paid) || 0;
                let dVal = parseFloat(mData.due) || 0;

                totalSum += tVal;
                paidSum += pVal;
                dueSum += dVal;

                let badgeClass = "status-due";
                if (mData.status === "Paid") badgeClass = "status-paid";
                else if (mData.status === "Pending") badgeClass = "status-pending";

                const item = document.createElement("div");
                item.className = "month-item";
                item.innerHTML = `
                    <div class="month-header" onclick="toggleAccordion(${index})">
                        <span>📅 ${month}</span>
                        <span class="status-badge ${badgeClass}">${mData.status || 'Due'}</span>
                    </div>
                    <div class="month-body" id="body-${index}">
                        <div class="fee-detail-row">
                            <span>Total Fee:</span>
                            <span>₹${tVal}</span>
                        </div>
                        <div class="fee-detail-row">
                            <span>Paid Amount:</span>
                            <span style="color: #2e7d32;">₹${pVal}</span>
                        </div>
                        <div class="fee-detail-row">
                            <span>Due Amount:</span>
                            <span style="color: #c62828;">₹${dVal}</span>
                        </div>
                        <div class="fee-detail-row">
                            <span>Payment Status:</span>
                            <span><b>${mData.status || 'Due'}</b></span>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });

            // Update Summary Cards
            document.getElementById("totalFee").innerText = `₹${totalSum}`;
            document.getElementById("paidFee").innerText = `₹${paidSum}`;
            document.getElementById("pendingFee").innerText = `₹${dueSum}`;
        }

        window.toggleAccordion = function(index) {
            const body = document.getElementById(`body-${index}`);
            body.classList.toggle("active");
        }

        window.addEventListener('DOMContentLoaded', fetchFeeData);
    </script>

</body>
</html>
