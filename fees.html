<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Status - Vidya Vihar Public School</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; }
        
        header { 
            background: linear-gradient(135deg, #1e3c72, #2a5298); 
            color: white; 
            padding: 22px 35px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            flex-wrap: wrap; 
            gap: 15px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
        
        .back-btn { 
            background-color: #ffffff; 
            color: #1e3c72; 
            padding: 8px 18px; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 14px; 
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .back-btn:hover { background-color: #e3f2fd; transform: translateY(-1px); }
        
        .container { 
            max-width: 850px; 
            margin: 35px auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.06); 
            border-top: 6px solid;
            border-image: linear-gradient(135deg, #2193b0, #6dd5ed) 1;
        }
        
        h2 { 
            color: #1e3c72; 
            border-bottom: 2px solid #edf2f7; 
            padding-bottom: 12px; 
            font-size: 20px; 
            margin-top: 0; 
        }

        /* Fee Summary Cards Grid */
        .fee-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .summary-card h4 {
            margin: 0 0 10px 0;
            color: #4a5568;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .summary-card .amount {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
            color: #1e3c72;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { padding: 12px; text-align: center; border: 1px solid #e2e8f0; font-size: 14px; }
        th { background: linear-gradient(135deg, #1e3c72, #2a5298); color: white; }
        
        .scrollable-table { max-height: 400px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px; }

        @media screen and (max-width: 600px) {
            header { padding: 15px; flex-direction: column; align-items: flex-start; }
            header h1 { font-size: 18px; }
            .container { margin: 15px; padding: 20px; width: auto; }
            .fee-summary-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>💰 Fee Status Portal</h1>
        <a href="#" id="backDashboard" class="back-btn">← Back to Dashboard</a>
    </header>

    <div class="container">
        <h2 id="studentTitle">Loading Fee Details...</h2>

        <!-- Fee Summary Cards -->
        <div class="fee-summary-grid">
            <div class="summary-card">
                <h4>Total Fee</h4>
                <p class="amount" id="totalFee">₹0</p>
            </div>
            <div class="summary-card">
                <h4>Paid Amount</h4>
                <p class="amount" style="color: #2e7d32;" id="paidFee">₹0</p>
            </div>
            <div class="summary-card">
                <h4>Pending Due</h4>
                <p class="amount" style="color: #c62828;" id="pendingFee">₹0</p>
            </div>
        </div>

        <h3 style="color: #1e3c72; font-size: 18px; margin-bottom: 15px;">📜 Transaction History</h3>

        <div class="scrollable-table">
            <table>
                <thead>
                    <tr>
                        <th>Receipt No.</th>
                        <th>Fee Type</th>
                        <th>Amount</th>
                        <th>Date</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="feeTableBody">
                    <tr><td colspan="5">Loading fee records...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3XBCZ2ZTwfqT2y3EXrkW0LPEz4fj9tBc",
            authDomain: "vidya-vihar-public-schoo-f3b61.firebaseapp.com",
            projectId: "vidya-vihar-public-schoo-f3b61",
            storageBucket: "vidya-vihar-public-schoo-f3b61.firebasestorage.app",
            messagingSenderId: "872134534556",
            appId: "1:872134534556:web:7fb8ea167c2947b5c05459"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const urlParams = new URLSearchParams(window.location.search);
        let studentId = urlParams.get('id');

        if (studentId) {
            document.getElementById("backDashboard").href = `student-dashboard.html?id=${studentId}`;
        }

        async function fetchFeeData() {
            if (!studentId) {
                document.getElementById("studentTitle").innerText = "No student session found.";
                return;
            }

            try {
                const docRef = doc(db, "students", studentId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    let data = docSnap.data();
                    document.getElementById("studentTitle").innerText = `Fee Details for: ${data.studentName || 'Student'} (${data.admissionNo || ''})`;
                    
                    let feeInfo = data.fees || { total: 0, paid: 0, pending: 0, history: [] };

                    document.getElementById("totalFee").innerText = `₹${feeInfo.total || 0}`;
                    document.getElementById("paidFee").innerText = `₹${feeInfo.paid || 0}`;
                    document.getElementById("pendingFee").innerText = `₹${feeInfo.pending || 0}`;

                    let tbody = document.getElementById("feeTableBody");
                    tbody.innerHTML = "";

                    if (feeInfo.history && feeInfo.history.length > 0) {
                        feeInfo.history.forEach(item => {
                            let statusColor = item.status === "Paid" ? "color: #2e7d32; font-weight: bold;" : "color: #c62828; font-weight: bold;";
                            let tr = document.createElement("tr");
                            tr.innerHTML = `
                                <td>${item.receiptNo || 'N/A'}</td>
                                <td>${item.feeType || 'Tuition Fee'}</td>
                                <td>₹${item.amount || 0}</td>
                                <td>${item.date || 'N/A'}</td>
                                <td style="${statusColor}">${item.status || 'Paid'}</td>
                            `;
                            tbody.appendChild(tr);
                        });
                    } else {
                        tbody.innerHTML = `<tr><td colspan="5">No fee transaction history found.</td></tr>`;
                    }

                } else {
                    document.getElementById("studentTitle").innerText = "Student record not found.";
                }
            } catch (error) {
                console.error("Error fetching fee details: ", error);
                document.getElementById("studentTitle").innerText = "Failed to load fee details.";
            }
        }

        window.addEventListener('DOMContentLoaded', fetchFeeData);
    </script>

</body>
</html>
